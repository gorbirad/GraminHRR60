<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GarminHRR60</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; background: #f7f7f7; color: #222; }
      main { max-width: 960px; margin: 0 auto; }
      button { padding: 0.6rem 1rem; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; background: white; margin-top: 1rem; }
      th, td { padding: 0.75rem; border-bottom: 1px solid #ddd; text-align: left; }
      .pill { border-radius: 999px; padding: 0.15rem 0.5rem; background: #eef; display: inline-block; }
      .meta { color: #555; margin: 0.5rem 0 1rem; }
      .error { color: #a40000; }
    </style>
  </head>
  <body>
    <main id="dashboard" aria-busy="false">
      <h1>GarminHRR60</h1>
      <p>Automatyczne odświeżanie treningów Garmin Connect oraz wyliczanie spadku tętna po 60 sekundach od końca głównej sesji.</p>
      <button id="refresh">Odśwież teraz</button>
      <p id="meta" class="meta">Ładowanie…</p>
      <p id="error" class="error"></p>
      <table aria-describedby="meta error">
        <caption>Wyniki HRR60 dla pobranych aktywności Garmin Connect</caption>
        <thead>
          <tr>
            <th>Data</th>
            <th>Trening</th>
            <th>Typ</th>
            <th>HR koniec</th>
            <th>HR +60s</th>
            <th>HRR60</th>
            <th>Ocena</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </main>
    <script>
      const meta = document.getElementById('meta');
      const error = document.getElementById('error');
      const tbody = document.getElementById('results');
      const refreshButton = document.getElementById('refresh');
      const dashboard = document.getElementById('dashboard');

      function appendCell(row, value) {
        const cell = document.createElement('td');
        cell.textContent = value ?? '-';
        row.appendChild(cell);
      }

      function renderResults(results) {
        tbody.textContent = '';

        if (!results.length) {
          const row = document.createElement('tr');
          const cell = document.createElement('td');
          cell.colSpan = 7;
          cell.textContent = 'Brak treningów.';
          row.appendChild(cell);
          tbody.appendChild(row);
          return;
        }

        for (const result of results) {
          const row = document.createElement('tr');
          appendCell(row, result.startTime);
          appendCell(row, result.name);

          const activityCell = document.createElement('td');
          const pill = document.createElement('span');
          pill.className = 'pill';
          pill.textContent = result.activityType;
          activityCell.appendChild(pill);
          row.appendChild(activityCell);

          appendCell(row, result.endHeartRate);
          appendCell(row, result.heartRateAt60Sec);
          appendCell(row, result.hrr60);
          appendCell(row, result.classification);
          tbody.appendChild(row);
        }
      }

      async function load(method = 'GET') {
        dashboard.setAttribute('aria-busy', 'true');
        refreshButton.disabled = true;
        error.textContent = '';
        meta.textContent = 'Ładowanie…';

        try {
          const response = await fetch(method === 'POST' ? '/api/refresh' : '/api/results', { method });
          const rawPayload = await response.text();
          let payload;

          try {
            payload = rawPayload ? JSON.parse(rawPayload) : {};
          } catch {
            throw new Error(`Nieprawidłowa odpowiedź serwera (${response.status})`);
          }

          if (!response.ok) {
            throw new Error(payload.error ?? `Nie udało się odświeżyć danych (${response.status})`);
          }

          meta.textContent = payload.refreshedAt
            ? `Źródło: ${payload.source} · Ostatnie odświeżenie: ${payload.refreshedAt}`
            : 'Brak danych';
          error.textContent = payload.error ?? '';
          renderResults(payload.results);
        } catch (fetchError) {
          meta.textContent = 'Nie udało się pobrać wyników.';
          error.textContent = fetchError.message;
          renderResults([]);
        } finally {
          dashboard.setAttribute('aria-busy', 'false');
          refreshButton.disabled = false;
        }
      }

      refreshButton.addEventListener('click', () => load('POST').catch((fetchError) => {
        error.textContent = fetchError.message;
      }));

      load().catch((fetchError) => {
        error.textContent = fetchError.message;
        meta.textContent = 'Nie udało się pobrać wyników.';
      });
    </script>
  </body>
</html>
