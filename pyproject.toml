[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-hrr"
version = "0.1.0"
description = "Automatyczne wyliczanie Heart Rate Recovery 60s (HRR60) na podstawie treningów z Garmin Connect."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
